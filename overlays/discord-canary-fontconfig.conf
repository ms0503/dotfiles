<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <include>/etc/fonts/fonts.conf</include>
    <selectfont>
        <rejectfont>
            <pattern>
                <patelt name="family">
                    <string>MS Gothic</string>
                </patelt>
            </pattern>
            <pattern>
                <patelt name="family">
                    <string>MS PGothic</string>
                </patelt>
            </pattern>
            <pattern>
                <patelt name="family">
                    <string>MSGothic</string>
                </patelt>
            </pattern>
            <pattern>
                <patelt name="family">
                    <string>MSPGothic</string>
                </patelt>
            </pattern>
            <pattern>
                <patelt name="family">
                    <string>Meiryo</string>
                </patelt>
            </pattern>
            <pattern>
                <patelt name="family">
                    <string>メイリオ</string>
                </patelt>
            </pattern>
            <pattern>
                <patelt name="family">
                    <string>ＭＳ ゴシック</string>
                </patelt>
            </pattern>
            <pattern>
                <patelt name="family">
                    <string>ＭＳ Ｐゴシック</string>
                </patelt>
            </pattern>
        </rejectfont>
    </selectfont>
</fontconfig>
